{% extends "base.html" %}

{% block title %}Add Contact{% endblock %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-primary text-white">
        <h3>Add New Contact</h3>
    </div>

    <div class="card-body">

        <form action="/save-contact" method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">Contact ID</label>

                    <input
                        type="text"
                        name="contact_id"
                        class="form-control"
                        required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">Full Name</label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">Phone Number</label>

                    <input
                        type="text"
                        name="phone"
                        class="form-control"
                        required>

        </div>

            <button class="btn btn-success">
                Save Contact
            </button>

            <button type="reset" class="btn btn-secondary">
                Reset
            </button>

        </form>

    </div>

</div>

{% endblock %}

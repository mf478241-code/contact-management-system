{% extends "base.html" %}

{% block title %}Edit Contact{% endblock %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-warning text-dark">
        <h3>Edit Contact</h3>
    </div>

    <div class="card-body">

        <form action="{{ url_for('update_contact', contact_id=contact.id) }}" method="POST">

            <div class="mb-3">
                <label class="form-label">Name</label>
                <input
                    type="text"
                    name="name"
                    class="form-control"
                    value="{{ contact.name }}"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input
                    type="text"
                    name="phone"
                    class="form-control"
                    value="{{ contact.phone }}"
                    required>
            </div>

            <button type="submit" class="btn btn-success">
                Update Contact
            </button>

            <a href="{{ url_for('contacts') }}" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
